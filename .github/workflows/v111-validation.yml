name: v111 validation
on:
  push:
    branches: [fix/v111-native-journal-meter]
    paths-ignore:
      - '.github/migrations/**'
      - '.github/workflows/v111-apply.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Behavior suites and native metadata contracts
        run: bash build.sh
      - name: Native journal regression tests
        run: |
          if test -f tests/NativeJournal.Core.Tests.csproj; then
            dotnet run --project tests/NativeJournal.Core.Tests.csproj --configuration Release
          fi
      - name: Record source revision
        run: git rev-parse HEAD >> dist/BetterSpire2Lite/BUILD-SUCCESS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSpire-v111
          path: dist/BetterSpire2Lite/
          if-no-files-found: error
