name: Validate Osty and native hooks
on:
  push:
    branches: [fix/v111-osty-native-hooks]
    paths: ['.github/workflows/v111-osty-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/v111-osty-native-hooks'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 10
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x
      - name: Apply reviewed source patch at pinned baseline
        run: |
          set -euo pipefail
          git diff --exit-code f68bac4fea180b26f979eafedaba98f11c4af3c6 -- BetterSpire2 tests Properties BetterSpire2Lite.csproj build.sh build.ps1 README.md
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/migrations/osty-hooks.{i}.b64').read_text().strip() for i in range(3))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ab5fcb8487752c7d4ba05d5f32cc016894934ffc5dc3a9aaa832375dae2d17b8', 'Patch integrity check failed'
          Path('/tmp/osty-hooks.patch').write_bytes(patch)
          PY
          git apply --check /tmp/osty-hooks.patch
          git apply /tmp/osty-hooks.patch
          git diff --check
      - name: Run ten behavior suites, compile mod and verify native contracts
        run: bash build.sh
      - name: Commit only validated source and remove one-time transport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BetterSpire2 tests Properties BetterSpire2Lite.csproj build.sh build.ps1 README.md
          git rm .github/migrations/osty-hooks.0.b64 .github/migrations/osty-hooks.1.b64 .github/migrations/osty-hooks.2.b64 .github/workflows/v111-osty-apply.yml
          git commit -m 'fix: v111 receiver-scoped Osty reactions and readonly native hook observer'
          git push origin HEAD:refs/heads/fix/v111-osty-native-hooks
          git rev-parse HEAD >> dist/BetterSpire2Lite/BUILD-SUCCESS.txt
          git archive --format=zip --output=/tmp/BetterSpire-sources.zip HEAD BetterSpire2 tests BetterSpire2Lite.csproj build.sh build.ps1 build.cmd README.md global.json NuGet.Config Properties .github/workflows/v111-validation.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BetterSpire-3.6.2-v111
          path: dist/BetterSpire2Lite/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BetterSpire-3.6.2-sources
          path: /tmp/BetterSpire-sources.zip
          if-no-files-found: error
