name: Inspect v111 preview isolation
on:
  push:
    branches: [fix/v111-native-journal-meter]
    paths: ['.github/workflows/v111-preview-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
      - name: Read clone helpers without executing game assembly
        run: |
          dotnet tool install ilspycmd --tool-path /tmp/ilspy --version 9.1.0.7988 --add-source https://api.nuget.org/v3/index.json
          /tmp/ilspy/ilspycmd -t MegaCrit.Sts2.Core.Models.CardModel references/v111/sts2.dll > /tmp/CardModel.cs
          python3 - <<'PY'
          import re
          lines=open('/tmp/CardModel.cs').read().splitlines()
          for i,s in enumerate(lines):
              if re.search(r'(public|private|protected|internal).* (EnchantInternal|AfflictInternal|DeepCloneFields|AfterCloned|GetDescription|GetDescriptionForPile)\(',s):
                  print('\n===== '+s+' =====')
                  level=0; started=False
                  for l in lines[i:]:
                      print(l); level+=l.count('{')-l.count('}')
                      started=started or '{' in l
                      if started and level==0: break
          PY
