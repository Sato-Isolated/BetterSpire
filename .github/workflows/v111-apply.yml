name: Apply and validate v111 native integration
on:
  push:
    branches: [fix/v111-native-journal-meter]
    paths: ['.github/workflows/v111-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/v111-native-journal-meter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Apply reviewed native source changes
        run: |
          python3 .github/migrations/native_observer.py
          python3 .github/migrations/native_hand.py
          python3 .github/migrations/native_contracts.py
          git diff --check
      - name: Build and validate all behavior and native contracts
        run: bash build.sh
      - name: Commit verified source changes on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BetterSpire2 tests Properties BetterSpire2Lite.csproj build.sh build.ps1 README.md
          git rm -r .github/migrations
          git commit -m 'feat: v111 isolated previews, native journal meter and guarded forecast updates'
          git push origin HEAD:refs/heads/fix/v111-native-journal-meter
          git rev-parse HEAD >> dist/BetterSpire2Lite/BUILD-SUCCESS.txt
          git archive --format=zip --output=/tmp/BetterSpire-sources.zip HEAD BetterSpire2 tests BetterSpire2Lite.csproj build.sh build.ps1 build.cmd README.md global.json NuGet.Config Properties
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSpire-v111-native-final
          path: dist/BetterSpire2Lite/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSpire-native-sources
          path: /tmp/BetterSpire-sources.zip
          if-no-files-found: error
